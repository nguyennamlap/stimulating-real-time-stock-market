x-airflow-common:
  &airflow-common
  build:
    context: .
    dockerfile: Dockerfile.airflow
  user: "${AIRFLOW_UID:-50000}:${DOCKER_GID:-0}"
  env_file:
    - .env
  environment:
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: postgresql+psycopg2://${DB_USER:-admin}:${DB_PASSWORD:-airflow}@postgres-dw/${DB_NAME:-airflow}
    AIRFLOW__WEBSERVER__SECRET_KEY: ${AIRFLOW_WEBSERVER_SECRET_KEY}
    AIRFLOW_ADMIN_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD:-admin}
    AIRFLOW_ADMIN_EMAIL: ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY:-t2H1A74HwZ9J8c4k8O3h7n2V9L6r2G3o4M6u2C1V4c8=}
    AIRFLOW__CORE__LOAD_EXAMPLES: "False"
    AIRFLOW__LOGGING__BASE_LOG_FOLDER: /opt/airflow/logs
    AIRFLOW_CONN_POSTGRES_STOCK: postgresql://${DB_USER:-admin}:${DB_PASSWORD:-airflow}@postgres-dw:5432/${DB_NAME:-airflow}
    HOST_PROJECT_DIR: ${HOST_PROJECT_DIR}
    PYTHONPATH: /opt/airflow/src
    AIRFLOW__WEBSERVER__BASE_URL: http://localhost:8080
    AIRFLOW__LOGGING__WORKER_LOG_SERVER_PORT: 8793
    AIRFLOW__CORE__HOSTNAME_CALLABLE: airflow.utils.net.get_host_ip_address
    AIRFLOW__LOGGING__LOG_FETCH_TIMEOUT_SEC: 15
  volumes:
    - ../../airflow/dags:/opt/airflow/dags
    - ../../airflow/logs:/opt/airflow/logs
    - ../../airflow/plugins:/opt/airflow/plugins
    - /var/run/docker.sock:/var/run/docker.sock
    - ../../scripts:/opt/airflow/sql
    - ../../src/:/opt/airflow/src
  working_dir: /opt/airflow
  networks:
    - your-network


services: 

  airflow-init:
    <<: *airflow-common
    container_name: airflow_init
    # Fix cú pháp lệnh khởi tạo
    command: >
      bash -c "airflow db migrate &&
      airflow users create
      --username ${AIRFLOW_ADMIN_USER:-admin}
      --password ${AIRFLOW_ADMIN_PASSWORD:-admin}
      --firstname Admin
      --lastname User
      --role Admin
      --email ${AIRFLOW_ADMIN_EMAIL:-admin@example.com}"

  airflow-webserver:
    <<: *airflow-common
    command: webserver
    container_name: airflow_webserver
    ports:
      - "8080:8080"
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully 

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    container_name: airflow_scheduler
    restart: always
    depends_on:
      airflow-init:
        condition: service_completed_successfully 

networks:
  your-network:
    external: true
    name: your-network