services:
  scrapy:
    container_name: scrapy-2
    build:
      context: ..
      dockerfile: Extract/Dockerfile.scrapy
    env_file:
      - .env.crawl
    volumes:
      - ..:/app
    working_dir: /app
    command: tail -f /dev/null
    networks:
      - your-network
  
  data-validator:
    build: 
      context: ..
      dockerfile: Quality/Dockerfile
    container_name: stock-data-validator
    volumes:
      - ../Quality:/app/Quality
      - ../data:/app/data
      - ../log:/app/log
    environment:
      - LOG_LEVEL=INFO
    command: tail -f /dev/null
networks:
  default:
    external: true
    name: your-network 
