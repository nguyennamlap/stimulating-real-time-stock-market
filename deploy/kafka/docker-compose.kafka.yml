services:
  # 1. KAFKA 
  kafka:
    image: confluentinc/cp-kafka:7.6.0
    hostname: kafka
    container_name: kafka
    ports:
      - "9092:9092"
      - "29092:29092"
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093

      KAFKA_LISTENERS: PLAINTEXT://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: PLAINTEXT://kafka:9092,EXTERNAL://localhost:29092
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: CONTROLLER:PLAINTEXT,PLAINTEXT:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_INTER_BROKER_LISTENER_NAME: PLAINTEXT

      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1

      CLUSTER_ID: MkU3OEVBNTcwNTJENDM2Qk
    volumes:
      - kafka-data:/var/lib/kafka/data
    networks:
      - your-network
    healthcheck:
      test: ["CMD-SHELL", "/usr/bin/kafka-topics --bootstrap-server localhost:9092 --list"]
      interval: 10s
      timeout: 5s
      retries: 5

  # 2. PRODUCER - để debug trước khi tích hợp vào Spark Streaming App

  python-producer:
    container_name: python-producer
    build:
      context: ../..
      dockerfile: src/test/Dockerfile
    environment:
      KAFKA_BROKER: kafka:9092
    volumes:
      - ../../logging/kafka_log:/app/logging
    command: python main.py
    env_file:
      - .env
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - your-network
    restart: always


  # 3. POSTGRESQL (Metadata / Data Warehouse)

  postgres:
    image: postgres:15-alpine
    container_name: postgres-dw
    ports:
      - "5432:5432"
    environment:
      - POSTGRES_USER=${DB_USER:-admin}  
      - POSTGRES_PASSWORD=${DB_PASSWORD:-airflow}
      - POSTGRES_DB=${DB_NAME:-airflow}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks:
      - your-network
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U admin -d datawarehouse"]
      interval: 5s
      timeout: 5s
      retries: 5

  # 4. MINIO (Data Lake - Tương thích S3)

  minio:
    image: minio/minio:RELEASE.2024-01-16T16-07-38Z
    container_name: minio-datalake
    ports:
      - "9000:9000" # Port API
      - "9001:9001" # Port Web UI Console
    environment:
      - MINIO_ROOT_USER=${AWS_ACCESS_KEY_ID:-minioadmin}
      - MINIO_ROOT_PASSWORD=${AWS_SECRET_ACCESS_KEY:-minioadmin}
    command: server /data --console-address ":9001"
    volumes:
      - minio-data:/data
    networks:
      - your-network
    healthcheck:
          test: ["CMD", "mc", "ready", "local"]
          interval: 10s
          timeout: 5s
          retries: 5

  # 5. PGADMIN (Database Management UI)

  pgadmin:
    image: dpage/pgadmin4
    container_name: pgadmin
    ports:
      - "5050:80"
    environment:
      PGADMIN_DEFAULT_EMAIL: ${PGADMIN_EMAIL:-your_email@example.com}
      PGADMIN_DEFAULT_PASSWORD: ${PGADMIN_PASSWORD:-yourpassword}
    volumes:
      - pgadmin-data:/var/lib/pgadmin
    depends_on:
      postgres:
        condition: service_healthy
    networks:
      - your-network
      
  # 6. KAFKA UI (Giao diện web quản lý Kafka)
  kafka-ui:
    image: provectuslabs/kafka-ui:latest
    container_name: kafka-ui
    ports:
      - "8090:8080" 
    environment:
      - DYNAMIC_CONFIG_ENABLED=true
      - KAFKA_CLUSTERS_0_NAME=local-dev-cluster
      - KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS=kafka:9092
    depends_on:
      kafka:
        condition: service_healthy
    networks:
      - your-network

networks:
  your-network:
    external: true
    name: your-network

volumes:
  kafka-data:
    driver: local
  kafka-metadata:
    driver: local
  postgres-data:
    driver: local
  minio-data:
    driver: local
  pgadmin-data:
    driver: local